name: Test Plugin

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # vfox plugin test came with vfox 1.0.13. The release is pinned and its
      # checksum checked, as the actions are pinned by their commits; change the
      # two together to move to another release. Keep VFOX_VERSION in step with
      # .devcontainer/Dockerfile.
      VFOX_VERSION: 1.1.0
      VFOX_SHA256: 3b33c3c468b27bc17aecf0d6d3af24fe49fe204972984904a136a47b402a0ee4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install vfox
        run: |
          archive="$RUNNER_TEMP/vfox.tar.gz"
          curl --fail --silent --show-error --location --output "$archive" \
            "https://github.com/version-fox/vfox/releases/download/v${VFOX_VERSION}/vfox_${VFOX_VERSION}_linux_x86_64.tar.gz"
          echo "$VFOX_SHA256  $archive" | sha256sum --check
          mkdir "$RUNNER_TEMP/vfox"
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP/vfox" --strip-components=1 \
            "vfox_${VFOX_VERSION}_linux_x86_64/vfox"
          echo "$RUNNER_TEMP/vfox" >> "$GITHUB_PATH"
      # It finds tests/**/*_test.lua and runs each file in a VM of its own, with
      # vfox's Lua interpreter. A file that does not call test.load() from
      # vfox.test fails, and so does a run that finds no test file.
      - name: Run the offline hook tests with vfox
        run: vfox plugin test .
