name: License

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  license-eye:
    runs-on: ubuntu-latest
    env:
      # Apache SkyWalking Eyes, as the image it publishes: the dev container
      # copies license-eye out of the same one, so a local check and this one
      # are the same tool. Keep it in step with .devcontainer/Dockerfile.
      LICENSE_EYE_VERSION: 0.9.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check license headers
        run: docker run --rm --volume "$PWD:/work" --workdir /work "apache/skywalking-eyes:${LICENSE_EYE_VERSION}" header check
